<!DOCTYPE html>
<!--
  SWIPE NIGHT  v1.6   (file: swipe-night-v1.4.html)
  Two people, one phone. Each swipes separately; only shared yeses get revealed.
  Single file, no backend. Saves to localStorage (key "sn1"). Add to home screen to use like an app.
  Swipe: right = yes, left = no, up = maybe. Scores: no 0, maybe 1, yes 2.
  v1.4: Build tab movie moods are multi-select (match any or all).
  v1.3: Build tab. Endless swipe to grow the library (TMDB for movies, Claude API for food/outings).
  v1.2: install fix. App id/start/scope use this file's own URL; bigger icon.
  v1.1: neon intro animation, full swipe breakdown on results, Log tab of chosen picks.
  Keep this version in sync with the file name on every update.
-->

const $=s=>document.querySelector(s),ui=h=>$('#app').innerHTML=h,E=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

async function enrichMovieTitle(title){
  const key=normTitle(title);if(S.movieMeta[key]?.overview!==undefined&&S.movieMeta[key]?.img)return S.movieMeta[key];

async function enrichMovieLibrary(){

  // Small batches avoid overwhelming TMDB and cache each successful lookup.
  for(let i=0;i<titles.length;i+=4){await Promise.all(titles.slice(i,i+4).map(t=>enrichMovieTitle(t).catch(()=>null)));}
  save();

// one shuffle+sort: recently chosen items (30 days) sink to the end, then take 15
const deal=()=>pool().map(x=>[x,Math.random()+(Date.now()-(S.done[x.t]||0)<2592e6?1:0)]).sort((a,b)=>a[1]-b[1]).slice(0,15).map(x=>x[0]);
const ch=(a,v,t,on)=>`<button class="ch${on?' on':''}" data-a="${a}" data-v="${v}">${t}</button>`;
const sli=t=>`<div class="sl"><div class="kn">➜</div>${t}</div>`;
const ic=['✕','↑','♥'],tabs=n=>`<div class="tabs">${ch('tab',0,'💞 Swipe',!n)+ch('tab',2,'🔨 Build',n==2)+ch('tab',1,'📖 Log',n==1)}</div>`;
function logv(){

  ui(`<h1>Swipe Night</h1>${tabs(1)}<h3>What we chose</h3>${S.log.map((x,i)=>`<div class="rc"><span class="em">${E(x.e)}</span><div><b>${E(x.t)}</b><br><small class="sub">${TY[x.ty]} · ${new Date(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div><button data-a="logdel" data-v="${i}" aria-label="Remove">×</button></div>`).join('')||'<p class="sub">Nothing yet. Tap “We’re going with this” on a result to log it.</p>'}`);
}

function setup(){

  <h3>What are we picking?</h3>${Object.keys(TY).map(k=>ch('ty',k,TY[k],S.ty==k)).join('')}
  <h3>Which list?</h3>${ch('src','lib','Library',S.src=='lib')+ch('src','own','Our own',S.src=='own')+ch('src','both','Both',S.src=='both')}
  <h3>Show results as</h3>${ch('mode','match','💘 Matches',S.mode=='match')+ch('mode','top','🏆 Top 3',S.mode=='top')}
  ${S.src=='lib'?'':`<h3>Our ${TY[S.ty].split(' ')[1].toLowerCase()} list</h3>${mine.map((x,i)=>`<div class="li"><span>${E(x.e)} ${E(x.t)} <small class="sub">${cl(x.c)}</small></span><button data-a="del" data-v="${i}" aria-label="Remove">×</button></div>`).join('')||'<p class="sub">Nothing here yet. Add a few!</p>'}
  <div class="row" style="margin-top:10px"><input id="ne" placeholder="🍩" maxlength="4" style="flex:.5"><input id="nt" placeholder="Add a pick" maxlength="40" style="flex:2"><select id="nc" style="flex:.8"><option value="-1">—</option><option value="0">Free</option><option value="1">$</option><option value="2">$$</option><option value="3">$$$</option></select></div><button class="ch" data-a="add">+ Add</button>`}
  <button class="go" data-a="start"${n<2?' disabled':''}>${n<2?'Add at least 2 picks':'Start swiping →'}</button>
  <p class="tip">${n} picks in the pile · deals up to 15 · v1.6</p>`);
}
function cover(p,kind){
  const[a,b]=S.n.map(E);document.body.className=kind=='ready'?'':'p'+p;
  const m={start:['👀',`${a}’s turn!`,`${b}, look away until the phone is handed over. No peeking!`,'Slide when only you are looking'],
    pass:['🤝',`Pass it to ${b}!`,`${a} is done. ${b}, no peeking at ${a}’s picks. They’re hidden anyway 🙈`,`Slide when you’re holding the phone`],
    ready:['🎉','Both done!','Ready for the results? Gather round together first.','Slide to reveal']}[kind];
  ui(`<div class="cv"><div class="em">${m[0]}</div><h2 style="margin:12px 0 4px">${m[1]}</h2><p>${m[2]}</p>${sli(m[3])}</div>`);

function slide(cb){
  const t=$('.sl'),k=t.firstChild;let x0=null;const m=()=>t.clientWidth-k.offsetWidth-8;

function card(x,c){const flipped=!!G.flipped&&c=='top';return`<div class="card ${c}${flipped?' flipped':''}" data-movie-card="${c}"><b class="st y">YES</b><b class="st n">NOPE</b><b class="st m">MAYBE</b>${flipped?`<div class="poster-title">${E(x.t)}</div><div class="overview">${E(x.overview||'No TMDB summary is available for this title.')}</div><div class="flipnote">Tap to see poster ↻</div>`:`${x.img?`<img class="poster" src="${E(x.img)}" alt="${E(x.t)} poster" draggable="false">`:`<div class="em">${x.e}</div>`}<div class="ti">${E(x.t)}</div>${x.c<0?'':`<span class="cost">${cl(x.c)}</span>`}${(x.img||x.overview||x.id)?'<div class="flipnote">Tap poster for summary ↻</div>':''}`}</div>`}

function drag(){

  c.onpointerdown=e=>{on=1;moved=false;x0=e.clientX;y0=e.clientY;dx=dy=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
  c.onpointermove=e=>{if(!on)return;dx=e.clientX-x0;dy=Math.min(0,e.clientY-y0);if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;

const MF={pop:'🔥 Popular',anime:'🎌 Anime',animated:'🎨 Animated',marvel:'🦸 Marvel',scifi:'🚀 Sci-fi',fantasy:'🧙 Fantasy',family:'🏠 Family',action:'💥 Action',thriller:'🔪 Thriller',like:'💞 Like my picks'},
M={anime:{g:'16',l:'ja'},animated:{g:'16'},marvel:{c:'420'},scifi:{g:'878'},fantasy:{g:'14'},family:{g:'10751,12'},action:{g:'28'},thriller:{g:'53'}},
TS={food:'Thai, fresh market bowls, pizza, Mexican, casserole and Italian',outings:'predictable, budget-friendly places like TJ Maxx, Dave & Buster’s and a simple walk, plus farmers markets and craft fairs'};

const mq=a=>{const g=[],c=[];let l='';a.forEach(k=>{const m=M[k];if(m){m.g&&g.push(m.g);m.c&&c.push(m.c);m.l&&(l=m.l)}});return(g.length?`&with_genres=${g.join(',')}`:'')+(c.length?`&with_companies=${c.join(',')}`:'')+(l?`&with_original_language=${l}`:'')};
function buildv(){

  ui(`<h1>Swipe Night</h1>${tabs(2)}<h3>Build our library</h3><p class="sub">Swipe right to add, left to skip, up for not now.</p>
  ${Object.keys(TY).map(k=>ch('ty2',k,TY[k],S.ty==k)).join('')}
  ${m?`<h3>Movie moods (pick any)</h3>${Object.keys(MF).map(k=>ch('bf',k,MF[k],S.bfs.includes(k))).join('')}${S.bfs.length>1?`<div class="tip" style="text-align:left;margin:6px 0">Match</div>${ch('bm','any','Any of these',S.bm!='all')+ch('bm','all','All of these',S.bm=='all')}`:''}<h3>TMDB API key</h3><input data-k="tmdb" type="password" placeholder="Paste your TMDB v3 API key" value="${E(S.k.tmdb)}" style="width:100%">`
  :`<h3>Vibe (optional)</h3><input id="bv" placeholder="cheap, cozy, rainy day…" maxlength="60" value="${E(S.bv)}" style="width:100%"><h3>Claude API key</h3><input data-k="ai" type="password" placeholder="Paste your Anthropic API key" value="${E(S.k.ai)}" style="width:100%">`}
  <details><summary>Our saved ${m?'movies':'ideas'} (${S.cu[S.ty].length})</summary>${S.cu[S.ty].map((raw,i)=>{const x=S.ty==='movies'?metaFor(raw):raw;return `<div class="li">${x.img?`<img src="${E(x.img)}" alt="" style="width:42px;height:60px;object-fit:cover;border-radius:6px;margin-right:8px">`:''}<span style="flex:1">${E(x.e||'⭐')} ${E(x.t)}</span><button data-a="delbuild" data-v="${i}" aria-label="Remove">×</button></div>`}).join('')||'<p class="sub">Nothing saved yet.</p>'}</details>
  <p class="tip">Keys stay on this phone. Use a free or spend-limited key.</p><button class="go" data-a="bgo">Start swiping →</button>`);
}
const bc=(x,c)=>`<div class="card ${c}" data-movie-card="${c}"><b class="st y">ADD</b><b class="st n">SKIP</b><b class="st m">LATER</b>${x.img?`<img src="${E(x.img)}" alt="${E(x.t)} poster" draggable="false" class="poster">`:`<div class="em">${x.e}</div>`}<div class="ti">${E(x.t)}</div>${x.s?`<span class="cost">${E(x.s)}</span>`:x.c>=0?`<span class="cost">${cl(x.c)}</span>`:''}</div>`;
function bsw(){
  BD=1;document.body.className='p0';const c=B.q[0];
  if(!c){ui(B.err?`<div class="cv"><div class="em">😅</div><p>${E(B.err)}</p><button class="go" data-a="bdone">Back</button></div>`:`<div class="cv"><div class="em">⏳</div><p>Finding picks…</p></div>`);if(!B.err)bfill();return}

  <div class="btns"><button data-a="ans" data-v="0" aria-label="Skip">✕<small>skip</small></button><button data-a="ans" data-v="1" aria-label="Not now">↑<small>not now</small></button><button data-a="ans" data-v="2" aria-label="Add">♥<small>add</small></button></div>
  <p class="tip">swipe → add · ← skip · ↑ not now · <button class="undo" data-a="bdone">done</button></p>`);

}
async function bfill(){
  if(B.busy)return;B.busy=1;const w=!B.q.length;let n=0;
  try{const r=await more();n=r.length;B.q.push(...r)}catch(e){B.err=e.message||'Network hiccup'}
  B.busy=0;B.t=n?0:B.t+1;if(B.t>4&&!B.q.length)B.err=B.err||'Nothing new here. Try another mood!';
  if(BD&&w)bsw();
}
async function more(){
  const ty=S.ty,all=[...LIB[ty].map(P),...S.cu[ty]].map(x=>x.t.toLowerCase()),sn=new Set([...(S.seen[ty]||[]),...(B.sessionSkip||[]),...B.q.map(x=>x.k),...all]);let r;
  if(ty=='movies'){
    if(!S.k.tmdb)throw Error('Add your TMDB key first.');
    const fs=S.bfs,both=S.bm=='all'&&fs.length>1,k=both?'and':fs[B.rr++%fs.length],pg=B.pgs[k]=(B.pgs[k]||0)+1,u=k=='like'&&S.last?`/movie/${S.last}/recommendations?`:`/discover/movie?sort_by=popularity.desc&vote_count.gte=300&include_adult=false${mq(both?fs:[k])}&`;
    const j=await(await fetch(`https://api.themoviedb.org/3${u}api_key=${S.k.tmdb}&page=${pg}`)).json();
    if(!j.results)throw Error(j.status_message||'TMDB hiccup');
    r=j.results.map(m=>({e:'🎬',t:m.title,c:-1,id:m.id,k:'m'+m.id,img:m.poster_path&&'https://image.tmdb.org/t/p/w342'+m.poster_path,overview:m.overview||'',s:(m.release_date||'').slice(0,4)+' · ⭐'+(m.vote_average||0).toFixed(1)}));
  }else{
    if(!S.k.ai)throw Error('Add your Claude API key first.');
    const av=[...all,...(S.seen[ty]||[])].slice(-45).join('; ');
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.k.ai,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,messages:[{role:'user',content:`Suggest 12 ${ty=='food'?'dinner ideas (restaurant types or home meals)':'date or weekend outing ideas'} for a couple who like ${TS[ty]}. Budget-conscious, predictable, low-risk. ${S.bv?'Vibe: '+S.bv+'. ':''}Avoid: ${av}. Reply with ONLY a JSON array of {"e":"one emoji","t":"title, max 5 words","c":cost tier 0 free to 3 pricey}.`}]})});
    const j=await resp.json();
    if(!resp.ok||j.error)throw Error(j.error?.message||`Idea API request failed (${resp.status}). Check your API key and access.`);
    const t=j.content?.find(x=>x.type==='text')?.text;
    if(!t)throw Error('The idea API returned no text. Check your key, model access, and spending limit.');
    const start=t.indexOf('['),end=t.lastIndexOf(']');if(start<0||end<start)throw Error('The idea API returned an unexpected format. Tap Start swiping to try again.');
    r=JSON.parse(t.slice(start,end+1)).map(x=>({e:x.e||'⭐',t:String(x.t||'').trim(),c:x.c>=0&&x.c<=3?Math.round(x.c):-1,k:String(x.t||'').toLowerCase()}));
  }
  return r.filter(x=>x.t&&!sn.has(x.k)&&!sn.has(x.t.toLowerCase()));
}
function bnext(v){
  const c=B.q.shift();
  if(v==0)S.seen[S.ty]=(S.seen[S.ty]||[]).concat(c.k||c.t.toLowerCase()).slice(-1200);else if(v==1){const key=c.k||c.t.toLowerCase();B.sessionSkip=(B.sessionSkip||[]).concat(key);B.q=B.q.filter(x=>(x.k||x.t.toLowerCase())!==key)}
  if(v==2){S.cu[S.ty].push({e:c.e,t:c.t,c:c.c,id:c.id,img:c.img||'',overview:c.overview||'',k:c.k||''});B.n++;if(S.src=='lib')S.src='both';if(c.id)S.last=c.id}
  save();if(B.q.length<5)bfill();bsw();
}
const lst=()=>G.deck.map((x,i)=>({x,s:G.a[0][i]+G.a[1][i],v:!G.a[0][i]||!G.a[1][i],a:[G.a[0][i],G.a[1][i]]}));
function results(){
  document.body.className='';const L=lst();let note='',
  R=S.mode=='match'?L.filter(r=>r.s==4):L.filter(r=>!r.v).sort((a,b)=>b.s-a.s).slice(0,3);
  if(!R.length){R=L.filter(r=>r.s==3&&!r.v);note=R.length?'No perfect matches 😅 Closest calls (one yes + one maybe):':'Nothing in common this round 🫠 Try another list or category!'}
  else if(R.length>5)note='Lots of matches! 🎉 Let fate pick?';
  G.R=R;
  ui(`<h2>${S.mode=='match'?'It’s a match! 💘':'Your top picks 🏆'}</h2><div style="margin:12px 0 4px">${ch('rm','match','Matches',S.mode=='match')+ch('rm','top','Top 3',S.mode=='top')}</div>
  ${note?`<p>${note}</p>`:''}${R.map((r,i)=>`<div class="rc"><span class="em">${S.mode=='top'&&R.length>1?['🥇','🥈','🥉'][i]||r.x.e:r.x.e}</span><div><b>${E(r.x.t)}</b><br><small class="sub">${cl(r.x.c)} ${E(S.n[0])} ${ic[r.a[0]]} · ${E(S.n[1])} ${ic[r.a[1]]} · ${r.s}/4</small></div><button data-a="win" data-v="${i}">We’re going with this</button></div>`).join('')}
  ${R.length>1?'<button class="go" data-a="pick">Pick for us 🎲</button>':''}
  <details><summary>See all swipes</summary><p class="sub">${L.filter(r=>r.s==4).length} matches · ${L.filter(r=>r.v).length} vetoed · ${L.length} cards</p>
  <div class="tb th"><span></span><b>${E(S.n[0])}</b><b>${E(S.n[1])}</b><b>Score</b></div>${L.slice().sort((a,b)=>b.s-a.s).map(r=>`<div class="tb"><span>${r.x.e} ${E(r.x.t)}</span><i class="a${r.a[0]}">${ic[r.a[0]]}</i><i class="a${r.a[1]}">${ic[r.a[1]]}</i><b>${r.s}/4${r.v?' 🚫':''}</b></div>`).join('')}</details><button class="ch" style="margin-top:14px" data-a="again">↺ New round</button>`);
}
const A={
  ty:v=>{S.ty=v;save();setup()},src:v=>{S.src=v;save();setup()},mode:v=>{S.mode=v;save();setup()},
  rm:v=>{S.mode=v;save();results()},

  tab:v=>{BD=0;[setup,logv,buildv][+v]()},
  ty2:v=>{S.ty=v;save();buildv()},bf:v=>{let a=S.bfs.includes(v)?S.bfs.filter(x=>x!=v):[...S.bfs.filter(x=>x!='pop'),v];if(v=='pop'||!a.length)a=['pop'];S.bfs=a;save();buildv()},bm:v=>{S.bm=v;save();buildv()},bdone:()=>{BD=0;buildv()},delbuild:v=>{S.cu[S.ty].splice(+v,1);save();buildv()},
  bgo:async()=>{const keyInput=$('[data-k="tmdb"]')||$('[data-k="ai"]');if(keyInput)S.k[keyInput.dataset.k]=keyInput.value.trim();if(S.ty!='movies')S.bv=$('#bv').value.trim();if(S.ty=='movies'&&!S.k.tmdb){alert('Paste your TMDB API key first.');return}if(S.ty!='movies'&&!S.k.ai){alert('Paste your Anthropic API key first.');return}B={q:[],pgs:{},rr:0,n:0,t:0,err:'',busy:0,sessionSkip:[],flip:false};save();if(S.ty==='movies'){ui('<div class="cv"><div class="em">🎬</div><h2>Preparing movie picks…</h2><p class="sub">Loading your library posters and summaries.</p></div>');try{await enrichMovieLibrary()}catch(e){console.warn(e.message)}}bsw()},
  logdel:v=>{const t=S.log[+v].t;S.log.splice(+v,1);const m=S.log.filter(x=>x.t==t).map(x=>x.d);m.length?S.done[t]=Math.max(...m):delete S.done[t];save();logv()},
  pick:()=>{const r=[...document.querySelectorAll('.rc')],T=r.length*3+Math.random()*r.length|0;let i=0;
    (function f(){r.forEach((e,j)=>e.classList.toggle('hl',j==i%r.length));if(i++<T)setTimeout(f,50+i*i*.8)})()},
  again:setup
};
$('#app').onclick=e=>{const card=e.target.closest('[data-movie-card="top"]');if(card&&S.ty=='movies'&&((BD&&(B.q[0]?.img||B.q[0]?.overview||B.q[0]?.id))||(!BD&&(G.deck?.[G.i]?.img||G.deck?.[G.i]?.overview||G.deck?.[G.i]?.id)))){if(BD){B.flip=!B.flip;card.outerHTML=B.flip?`<div class="card top flipped" data-movie-card="top"><b class="st y">ADD</b><b class="st n">SKIP</b><b class="st m">LATER</b><div class="poster-title">${E(B.q[0].t)}</div><div class="overview">${E(B.q[0].overview||'No TMDB summary is available.')}</div><div class="flipnote">Tap to see poster ↻</div></div>`:bc(B.q[0],'top');}else{G.flipped=!G.flipped;swipe();return}return}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v,b)};
