<!doctype html>
<!--
  TONIGHT’S ENTRY TICKET — VERSION 2.8
  File name: entry-ticket-v2.8.html
  On every update, keep these three in sync: this header, VERSION in the script, and the file name.

  Changelog (newest first)
  2.8  install fix: manifest scope/id/start_url use this file's own URL
  2.7  Fix: words no longer overlap “FEELING” when plans are added (words get a reserved zone); faster share (reuses the on-screen card, lighter JPEG, earlier pre-render)
  2.6  Card: footer shrunk to one small line (ADMIT ONE · No.), perforation moved down; emoji window and plans area use the freed space so nothing overlaps
  2.5  Card: check-in box on one line directly under the emoji/color window; bottom color chip removed; ticket number centered on the stub
  2.4  Card: removed the color hex code and “MOOD COLOR” label; the check-in box now sits beside the color chip
  2.3  Custom plans: emoji box + name box, removable with ×; in-app emoji picker (with keyboard fallback) for custom plans and the main “More emojis” field
  2.2  Plans area on the card scales with the number of plans (arch and words grow or shrink to fill the space)
  2.1  “I want to do something specific tonight” checkbox, gold banner + bottom-sheet activity menu with Want/Need pills; chosen items appear on the card (card unchanged when none chosen)
  2.0  Feeling word bank (energy × pleasantness quadrants) above the words box; “I want a check-in” checkbox shown on the card; faster share (pre-rendered JPEG)
  1.0  Emoji + color + words ticket card, local log, share sheet, home-screen install
-->

const AC=[['🔥','Have a fire'],['🌶️','Spicy times'],['🎬','Movie night'],['👑','Watch Drag Race'],['🎮','Play a video game together'],['🃏','Play a card game together'],['🧘','Some me time'],['🎨','Do art together'],['🚶','Go on a walk'],['🍳','Cook together'],['🛁','Take a bath']],AK='entryTicketsCustom';let cu=[];try{cu=JSON.parse(localStorage.getItem(AK)||'[]')}catch(_){}
function bnSync(){const n=cur.pl.length;$('#bn').classList.toggle('hide',!(cur.sp&&view==1));$('#bs').textContent=n?n+' chosen · tap to edit':'Tap to choose'}
function renderAC(){const l=$('#al');l.innerHTML='';[...AC,...cu].forEach(([em,n],ix)=>{const k=cur.pl.findIndex(p=>p.n===n),r=document.createElement('div'),a=document.createElement('span'),t=document.createElement('span');r.className='ar'+(k>-1?' on':'');a.className='ae';a.textContent=em;t.className='at';t.textContent=n;r.append(a,t);
  if(k>-1){const p=document.createElement('button'),w=cur.pl[k].p;p.className='pl'+(w?' need':'');p.textContent=w?'Need':'Want';p.onclick=ev=>{ev.stopPropagation();cur.pl[k].p=w?0:1;planChanged()};r.append(p)}
  if(ix>=AC.length){const d=document.createElement('button');d.className='dx';d.textContent='×';d.setAttribute('aria-label','Remove '+n);d.onclick=ev=>{ev.stopPropagation();if(!d.dataset.a){d.dataset.a=1;d.textContent='Remove?';d.classList.add('arm');setTimeout(()=>{if(d.isConnected){delete d.dataset.a;d.textContent='×';d.classList.remove('arm')}},2500);return}cu.splice(ix-AC.length,1);try{localStorage.setItem(AK,JSON.stringify(cu))}catch(_){}cur.pl=cur.pl.filter(p=>p.n!==n);planChanged()};r.append(d)}
  r.onclick=()=>{if(k>-1)cur.pl.splice(k,1);else cur.pl.push({n,e:em,p:0});planChanged()};l.append(r)})}
function planChanged(){renderAC();bnSync();paint()}
const openSh=()=>{renderAC();$('#sh').classList.remove('hide')};
$('#sp').onchange=e=>{cur.sp=e.target.checked;bnSync();paint();if(cur.sp)openSh()};
$('#bn').onclick=openSh;$('#shd').onclick=()=>$('#sh').classList.add('hide');$('#sh').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.add('hide')};
$('#aa').onclick=()=>{const v=$('#an').value.trim(),em=$('#ae').value;if(!em){toast('Pick an emoji first');return}if(!v){$('#an').focus();return}if([...AC,...cu].some(a=>a[1].toLowerCase()===v.toLowerCase())){toast('Already on the list');return}cu.push([em,v]);try{localStorage.setItem(AK,JSON.stringify(cu))}catch(_){}cur.pl.push({n:v,e:em,p:0});$('#an').value='';$('#ae').value='';planChanged()};
$('#ae').onclick=()=>pickEmoji(g=>{$('#ae').value=g});
const EL=Array.from(new Intl.Segmenter().segment('😊😀😄😁😆🥹😍🥰😘😋😎🤩🥳😌😴🥱😪🤤😔😞😟😕😢😭😤😠😡🤬😰😨😱😳🥵🥶🤒🤕🤯🥲🫠🙃😏😬🤔🫡🤗🫶❤️🧡💛💚💙💜🖤🤍💖✨🌟🔥🌶️🎬🍿🎮🃏🎨🧘🚶🍳🛁🌙☀️🌈🌧️❄️☕🍷🍕🍫🎵📚🕯️🛋️🐶🐱🌿🌸'),s=>s.segment);
let epk=null;
function pickEmoji(cb){epk=cb;$('#et').value='';$('#es').classList.remove('hide')}
function epDone(g){$('#es').classList.add('hide');const f=epk;epk=null;if(g&&f)f(g)}
EL.forEach(g=>{const b=document.createElement('button');b.textContent=g;b.onclick=()=>epDone(g);$('#eg2').append(b)});
$('#esx').onclick=()=>epDone();$('#es').onclick=e=>{if(e.target===e.currentTarget)epDone()};
$('#et').oninput=e=>{const v=e.target.value.trim();if(v)epDone([...new Intl.Segmenter().segment(v)][0].segment)};
const WBQ=[['#E88B8B','High energy · Unpleasant','Angry Anxious Stressed Frustrated Overwhelmed Restless Nervous'],['#F5D76E','High energy · Pleasant','Excited Joyful Proud Playful Energized Inspired Loved'],['#8CA6D1','Low energy · Unpleasant','Sad Tired Lonely Bored Drained Disappointed Numb'],['#A8D08D','Low energy · Pleasant','Calm Content Peaceful Grateful Relaxed Hopeful Cozy']];
WBQ.forEach(([c,t,w])=>{const q=document.createElement('div'),h=document.createElement('div');q.className='q';q.style.setProperty('--c',c);h.className='ql';h.textContent=t;q.append(h);w.split(' ').forEach(n=>{const b=document.createElement('button');b.className='wc';b.textContent=n;b.onclick=()=>tapWord(n);q.append(b)});$('#wb').append(q)});
function mark(){const a=$('#wd').value.split(',').map(s=>s.trim().toLowerCase());document.querySelectorAll('.wc').forEach(b=>b.classList.toggle('on',a.includes(b.textContent.toLowerCase())))}
function tapWord(n){const i=$('#wd'),a=i.value.split(',').map(s=>s.trim()).filter(Boolean),k=a.findIndex(s=>s.toLowerCase()===n.toLowerCase());
  if(k>-1)a.splice(k,1);else{if(a.join(', ').length+(a.length?2:0)+n.length>40){toast('That’s all that fits');return}a.push(n.toLowerCase())}
  i.value=a.join(', ');cur.words=i.value;paint();mark()}
function commit(){if(!cur.words.trim()){$('#wd').focus();toast('Add a few words first');return null}
  const e={...cur,words:cur.words.trim(),pl:cur.pl.map(p=>({...p}))};log.unshift(e);save();return e}
async function share(e){let b=cache&&cache.k===key(e)?cache.b:!dirty&&key(e)===key(cur)?await jpg(pv):null;if(!b){draw(oc,e);b=await jpg(oc)}
  const f=new File([b],'entry-ticket-'+String(e.n).padStart(3,'0')+'.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(err){if(err.name==='AbortError')return}
  show(e);toast('Press and hold the image to save it')}
function reset(){cur.words='';cur.ci=false;cur.sp=false;cur.pl=[];$('#wd').value='';$('#ci').checked=false;$('#sp').checked=false;mark();bnSync();paint()}
$('#sv').onclick=async()=>{const e=commit();if(e){toast('Saved to your log');await share(e);reset()}};
$('#so').onclick=()=>{if(commit()){toast('Saved to your log');reset()}};
function show(e){openE=e;armed=0;$('#mdl').textContent='Delete';draw(oc,e);$('#mi').src=oc.toDataURL('image/jpeg',.85);$('#md').classList.remove('hide')}
$('#mx').onclick=()=>$('#md').classList.add('hide');
$('#ms').onclick=()=>share(openE);
$('#mdl').onclick=()=>{if(!armed){armed=1;$('#mdl').textContent='Tap again';return}log=log.filter(l=>l!==openE);save();$('#md').classList.add('hide');render()};
function render(){const ls=$('#ls');ls.innerHTML='';$('#cnt').textContent=log.length?log.length+(log.length>1?' entries':' entry'):'';
  if(!log.length){ls.innerHTML='<div class="empty">No tickets yet. Your first check-in will appear here.</div>';return}
  log.forEach(e=>{const b=document.createElement('button');b.className='item';
    const d=document.createElement('div');d.className='dot';d.style.background=e.color;d.textContent=e.emoji;
    const t=document.createElement('div'),w=document.createElement('b'),s=document.createElement('small');w.textContent=e.words;
    s.textContent=new Date(e.t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+new Date(e.t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+(e.ci?' · ✓ check-in':'')+(e.sp&&e.pl&&e.pl.length?' · '+e.pl.length+(e.pl.length>1?' plans':' plan'):'');
    t.append(w,s);b.append(d,t);b.onclick=()=>show(e);ls.append(b)})}
function tab(n){$('#v1').classList.toggle('hide',n!=1);$('#v2').classList.toggle('hide',n!=2);$('#t1').classList.toggle('on',n==1);$('#t2').classList.toggle('on',n==2);if(n==2)render();view=n;bnSync();scrollTo(0,0)}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
$('#ex').onclick=async()=>{const f=new File([JSON.stringify(log)],'entry-tickets-backup.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(_){}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d))throw 0;
  const seen=new Set(log.map(l=>l.t));d.forEach(l=>{if(l&&l.t&&!seen.has(l.t))log.push(l)});log.sort((a,b)=>b.t-a.t);save();render();toast('Backup imported')}catch(_){toast('That file could not be read')}};
paint();
(function(){try{const ic=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#0f2a20';x.fillRect(0,0,n,n);x.strokeStyle='#d4af5a';x.lineWidth=n*.02;x.strokeRect(n*.08,n*.08,n*.84,n*.84);x.fillStyle='#d4af5a';x.font=n*.5+'px '+SERIF;x.textAlign='center';x.textBaseline='middle';x.fillText('✦',n/2,n/2);return c.toDataURL()};
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic(180);document.head.append(a);
  const w=/^https?:/.test(location.protocol)?location.origin+location.pathname:'.';
  const m={name:'Tonight’s Entry Ticket',short_name:'Entry Ticket',display:'standalone',background_color:'#0f2a20',theme_color:'#0f2a20',start_url:w,id:w,scope:w,icons:[{src:ic(192),sizes:'192x192',type:'image/png'},{src:ic(512),sizes:'512x512',type:'image/png'}]};
  const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.append(k)}catch(_){}})();
</script>
</body>
</html>
