<!DOCTYPE html>
<!--
  SWIPE NIGHT  v2.3   (file: Swipe_Night_v2.3.html)
  Two people, one phone. Each swipes separately; only shared yeses get revealed.
  Single file, no backend. Saves to localStorage (key "sn1"). Add to home screen to use like an app.
  Swipe: right = yes, left = no, up = maybe. Scores: no 0, maybe 1, yes 2.
  v2.3: Two-phone sync via Firebase Realtime Database REST (couple code, merge, tombstones, skipped history), export/import backup, API key + sync UI tucked away, plum safe-area fill.
  v2.2: Fix. Flipped movie cards can be swiped again (summary no longer scrolls; Build flip re-attaches swipe handling and resets flip state).
  v2.1: Fix. Loader keyframes renamed (ld*) so they no longer override the neon intro's flicker animation.
  v2.0: Card Sorters loading animation (blobs flick cards into yes/nope bins, rotating messages) on Finding picks and poster loading.
  v1.9: System bars (status/nav) match the app's purple scheme: scheme-aware theme-color, purple manifest colors.
  v1.8: Open/closed state of saved lists now sticks on add/delete; AI ideas follow the vibe and stay balanced; broader at-home library.
  v1.7: Adds At-home activities with a separate library, custom picks, and Claude API suggestions.
  v1.6: Collapsible custom lists and abandon-swipe-session control.
  v1.4: Build tab movie moods are multi-select (match any or all).
  v1.3: Build tab. Endless swipe to grow the library (TMDB for movies, Claude API for food/outings).
  v1.2: install fix. App id/start/scope use this file's own URL; bigger icon.
  v1.1: neon intro animation, full swipe breakdown on results, Log tab of chosen picks.
  Keep this version in sync with the file name on every update.
-->

  ui(`<h2>${S.mode=='match'?'It’s a match! 💘':'Your top picks 🏆'}</h2><div style="margin:12px 0 4px">${ch('rm','match','Matches',S.mode=='match')+ch('rm','top','Top 3',S.mode=='top')}</div>
  ${note?`<p>${note}</p>`:''}${R.map((r,i)=>`<div class="rc"><span class="em">${S.mode=='top'&&R.length>1?['🥇','🥈','🥉'][i]||r.x.e:r.x.e}</span><div><b>${E(r.x.t)}</b><br><small class="sub">${cl(r.x.c)} ${E(S.n[0])} ${ic[r.a[0]]} · ${E(S.n[1])} ${ic[r.a[1]]} · ${r.s}/4</small></div><button data-a="win" data-v="${i}">We’re going with this</button></div>`).join('')}
  ${R.length>1?'<button class="go" data-a="pick">Pick for us 🎲</button>':''}
  <details><summary>See all swipes</summary><p class="sub">${L.filter(r=>r.s==4).length} matches · ${L.filter(r=>r.v).length} vetoed · ${L.length} cards</p>
  <div class="tb th"><span></span><b>${E(S.n[0])}</b><b>${E(S.n[1])}</b><b>Score</b></div>${L.slice().sort((a,b)=>b.s-a.s).map(r=>`<div class="tb"><span>${r.x.e} ${E(r.x.t)}</span><i class="a${r.a[0]}">${ic[r.a[0]]}</i><i class="a${r.a[1]}">${ic[r.a[1]]}</i><b>${r.s}/4${r.v?' 🚫':''}</b></div>`).join('')}</details><button class="ch" style="margin-top:14px" data-a="again">↺ New round</button>`);
}
const A={
  ty:v=>{S.ty=v;save();setup()},src:v=>{S.src=v;save();setup()},mode:v=>{S.mode=v;save();setup()},
  rm:v=>{S.mode=v;save();results()},

  start:async()=>{BD=0;if(S.ty==='movies'&&S.k.tmdb){loader('Preparing movie night…','Loading posters and summaries');try{await enrichMovieLibrary()}catch(e){console.warn('TMDB library enrichment:',e.message)} }G={deck:deal(),a:[[],[]],p:0,i:0};cover(0,'start')},

  win:(v,b)=>{if(b.dataset.ok)return;b.dataset.ok=1;const x=G.R[+v].x,d=Date.now();S.done[x.t]=d;S.log.unshift({e:x.e,t:x.t,ty:S.ty,d});save();b.textContent='✓ Locked in!';b.closest('.rc').classList.add('won')},
  tab:v=>{BD=0;[setup,logv,buildv][+v]()},
  ty2:v=>{S.ty=v;save();buildv()},bf:v=>{let a=S.bfs.includes(v)?S.bfs.filter(x=>x!=v):[...S.bfs.filter(x=>x!='pop'),v];if(v=='pop'||!a.length)a=['pop'];S.bfs=a;save();buildv()},bm:v=>{S.bm=v;save();buildv()},bdone:()=>{BD=0;buildv()},delbuild:v=>{const x=S.cu[S.ty].splice(+v,1)[0];if(x)S.tomb[S.ty+'|'+normTitle(x.t)]=Date.now();save();buildv()},
  bgo:async()=>{const keyInput=$('[data-k="tmdb"]')||$('[data-k="ai"]');if(keyInput)S.k[keyInput.dataset.k]=keyInput.value.trim();if(S.ty!='movies')S.bv=$('#bv').value.trim();if(S.ty=='movies'&&!S.k.tmdb){alert('Paste your TMDB API key first.');S.lo.dkeys=true;buildv();return}if(S.ty!='movies'&&!S.k.ai){alert('Paste your Anthropic API key first.');S.lo.dkeys=true;buildv();return}B={q:[],pgs:{},rr:0,n:0,t:0,err:'',busy:0,sessionSkip:[],flip:false};save();if(S.ty==='movies'){loader('Preparing movie picks…','Loading posters and summaries');try{await enrichMovieLibrary()}catch(e){console.warn(e.message)}}bsw()},
  syncnow:async()=>{if(!S.sy.on)return;loader('Syncing libraries…','Merging your lists');await sync();logv()},
  invite:(v,b)=>{const l=location.origin+location.pathname+'#j='+b64({c:S.sy.code,u:S.sy.url});navigator.clipboard.writeText(l).then(()=>{b.textContent='✓ Copied!'},()=>prompt('Copy this link:',l))},
  showcode:()=>{$('#cc').textContent=S.sy.code},
  syncoff:()=>{if(confirm('Stop syncing on this phone? Your lists stay.')){S.sy.on=false;save();logv()}},
  syncnew:async()=>{const u=($('#fu').value||'').trim();if(!/^https:\/\/.{6,}/.test(u)){alert('Paste the database address first.');return}S.sy={on:true,url:u.replace(/\/+$/,''),code:gen(),t:0};save();loader('Starting sync…','Setting up your couple code');await sync();logv()},
  syncjoin:async()=>{const u=($('#fu')?$('#fu').value:'').trim(),c=($('#jc').value||'').trim().toLowerCase();if(!/^https:\/\/.{6,}/.test(u)||c.length<20){alert('Add the database address and a full couple code.');return}S.sy={on:true,url:u.replace(/\/+$/,''),code:c,t:0};save();loader('Joining sync…','Pulling in your shared lists');await sync();logv()},
  bk:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snap())],{type:'application/json'}));a.download='swipe-night-backup.json';a.click()},
  rs:()=>$('#imp').click(),
  logdel:v=>{const t=S.log[+v].t;S.tomb['log|'+t+'|'+S.log[+v].d]=Date.now();S.log.splice(+v,1);const m=S.log.filter(x=>x.t==t).map(x=>x.d);m.length?S.done[t]=Math.max(...m):delete S.done[t];save();logv()},
  pick:()=>{const r=[...document.querySelectorAll('.rc')],T=r.length*3+Math.random()*r.length|0;let i=0;
    (function f(){r.forEach((e,j)=>e.classList.toggle('hl',j==i%r.length));if(i++<T)setTimeout(f,50+i*i*.8)})()},
  again:setup
};
$('#app').addEventListener('toggle',e=>{const d=e.target;if(d.tagName=='DETAILS'&&d.id&&d.id[0]=='d'){S.lo[d.id]=d.open;save()}},true);
